let running = false;
let addedCount = 0;
let skippedCount = 0;

function log(msg, type='') {
  const el = document.getElementById('log');
  const p = document.createElement('p');
  p.className = type;
  p.textContent = new Date().toLocaleTimeString() + ' ' + msg;
  el.appendChild(p);
  el.scrollTop = el.scrollHeight;
}

function updateProgress(done, total) {
  const pct = Math.round((done/total)*100);
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressText').textContent = done + ' / ' + total + ' (' + pct + '%)';
  document.getElementById('statSkip').textContent = skippedCount.toLocaleString();
  document.getElementById('statAdded').textContent = addedCount.toLocaleString();
}

function stopUpload() {
  running = false;
  log('Stopped by user.', 'warn');
  document.getElementById('btnStart').disabled = false;
  document.getElementById('btnStop').style.display = 'none';
}

async function startUpload() {
  running = true;
  addedCount = 0;
  skippedCount = 0;
  document.getElementById('btnStart').disabled = true;
  document.getElementById('btnStop').style.display = 'block';
  document.getElementById('log').innerHTML = '';

  log('Fetching existing barcodes from Firebase...');

  // Fetch existing items
  let existingBarcodes = new Set();
  try {
    const resp = await fetch(FIREBASE_URL + '/items.json');
    const data = await resp.json();
    if (data) {
      Object.values(data).forEach(item => {
        if (item.barcode) existingBarcodes.add(String(item.barcode).trim());
      });
    }
    log('Existing items in Firebase: ' + existingBarcodes.size);
  } catch(e) {
    log('Error fetching Firebase: ' + e.message, 'err');
    document.getElementById('btnStart').disabled = false;
    return;
  }

  // Filter new items
  const toAdd = NEW_ITEMS.filter(item => !existingBarcodes.has(String(item.barcode).trim()));
  log('Items to add: ' + toAdd.length + ' | Skip: ' + (NEW_ITEMS.length - toAdd.length));

  // Also add new categories
  log('Fetching existing categories...');
  let existingCats = new Set();
  try {
    const resp = await fetch(FIREBASE_URL + '/categories.json');
    const data = await resp.json();
    if (data) Object.values(data).forEach(c => existingCats.add(c));
  } catch(e) {}

  const newCats = [...new Set(toAdd.map(i => i.cat).filter(Boolean))].filter(c => !existingCats.has(c));
  if (newCats.length > 0) {
    log('Adding ' + newCats.length + ' new categories...');
    // Push categories
    for (const cat of newCats) {
      if (!running) break;
      try {
        await fetch(FIREBASE_URL + '/categories.json', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(cat)
        });
      } catch(e) {}
    }
    log('Categories added!');
  }

  // Upload in batches of 50
  const BATCH = 50;
  for (let i = 0; i < toAdd.length; i += BATCH) {
    if (!running) break;
    
    const batch = toAdd.slice(i, i + BATCH);
    const promises = batch.map(item => {
      const payload = {
        name: item.name,
        barcode: item.barcode,
        category: item.cat || '',
        physical: 0,
        system: item.stock || 0,
        note: '',
        addedAt: new Date().toISOString()
      };
      return fetch(FIREBASE_URL + '/items.json', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
      }).then(() => { addedCount++; })
        .catch(() => {});
    });
    
    await Promise.all(promises);
    skippedCount = NEW_ITEMS.length - toAdd.length;
    updateProgress(i + batch.length, toAdd.length);
    
    if (i % 200 === 0 && i > 0) {
      log('Progress: ' + addedCount + ' added so far...');
    }
    
    // Small delay to avoid rate limiting
    await new Promise(r => setTimeout(r, 200));
  }

  if (running) {
    log('✅ Done! Added: ' + addedCount + ' | Skipped: ' + skippedCount, '');
    document.getElementById('progressText').textContent = '✅ Complete!';
  }
  
  running = false;
  document.getElementById('btnStart').disabled = false;
  document.getElementById('btnStop').style.display = 'none';
}
</script>
