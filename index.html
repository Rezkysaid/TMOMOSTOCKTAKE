<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StockTake Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  /* LIGHT MODE - Electric Blue */
  --bg:#f0f4ff;--surface:#e8eeff;--card:#ffffff;--card2:#f5f7ff;
  --border:#c5cfff;--border2:#7c8fff;
  --accent:#3b5bfc;--accent2:#6b7fff;--accent3:#eef0ff;
  --green:#10b981;--red:#ef4444;--orange:#f59e0b;--yellow:#fbbf24;
  --text:#0f1535;--muted:#6b7dbc;--muted2:#8893cc;
  --mono:'Space Mono',monospace;--sans:'Space Grotesk',sans-serif;
  --shadow: 0 2px 16px rgba(59,91,252,0.12);
  --shadow-sm: 0 1px 8px rgba(59,91,252,0.08);
  --body-bg: #f0f4ff;
  --teal:#3b5bfc;--teal-dark:#2a45d4;--teal-light:#6b7fff;
  --gold:#f59e0b;
}

/* DARK MODE */
body.dark {
  --bg:#080c1a;--surface:#0d1228;--card:#111827;--card2:#161e35;
  --border:#1e2d52;--border2:#2a3f70;
  --accent:#4f6fff;--accent2:#7b8fff;--accent3:#111827;
  --green:#34d399;--red:#f87171;--orange:#fbbf24;--yellow:#fcd34d;
  --text:#e8eeff;--muted:#5a6fa8;--muted2:#7b8fc4;
  --shadow: 0 2px 20px rgba(0,0,0,0.5);
  --shadow-sm: 0 1px 10px rgba(0,0,0,0.3);
  --body-bg: #080c1a;
  --teal:#4f6fff;--teal-dark:#3b5bfc;--teal-light:#7b8fff;
  --gold:#fbbf24;
}

/* DARK MODE OVERRIDES */
body.dark header { background:#2845f0; }
body.dark .stat-item { background:#111827; border-color:#1e2d52; }
body.dark .btn-select-cat { background:#111827; border-color:#1e2d52; color:#e8eeff; }
body.dark .progress-fill { stroke:#4f6fff; }
body.dark .progress-bg { stroke:#1e2d52; }
body.dark .progress-pct { color:#4f6fff; }
body.dark .search-wrap input { background:#111827; border-color:#1e2d52; color:#e8eeff; }
body.dark .filter-select { background:#111827; border-color:#1e2d52; color:#e8eeff; }
body.dark .btn-add-item { background:#3b5bfc; box-shadow:0 4px 14px rgba(59,91,252,0.4); }
body.dark .watermark { background:#111827; border-color:#1e2d52; color:#5a6fa8; }
body.dark .cat-tab { background:#111827; border-color:#1e2d52; color:#7b8fc4; }
body.dark .cat-tab.active { background:#3b5bfc; border-color:#4f6fff; color:#fff; }
body.dark .item-card { background:#111827; border-color:#1e2d52; border-left-color:#4f6fff; }
body.dark .panel-top { background:#111827; }
body.dark .panel-bottom { background:#0d1228 !important; border-color:#1e2d52; }
body.dark .panel-bottom .panel-qty-num { color:#e8eeff !important; }
body.dark .panel-bottom .panel-qty-num.low { color:#f87171 !important; }
body.dark .panel-bottom .panel-qty-num.warn { color:#fbbf24 !important; }
body.dark .panel-bottom .panel-qty-num.ok { color:#34d399 !important; }
body.dark .panel-bottom .panel-qty-block { border-right-color:#1e2d52 !important; }
body.dark .panel-bottom .panel-label { color:#5a6fa8 !important; }
body.dark .panel-cat-badge { background:#1e2d52; color:#7b8fff; border-color:#2a3f70; }
body.dark .modal { background:#111827; border-color:#1e2d52; border-top-color:#4f6fff; }
body.dark .form-group input, body.dark .form-group select { background:#0d1228; border-color:#1e2d52; color:#e8eeff; }
body.dark .btn-cancel { background:#0d1228; border-color:#1e2d52; color:#7b8fc4; }

/* TOGGLE BUTTON */
.btn-theme {
  width: 36px; height: 36px;
  background: var(--card);
  border: 2px solid var(--border2);
  border-radius: 12px;
  cursor: pointer;
  font-size: 18px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: var(--clay-shadow-sm), var(--clay-inset);
  transition: all 0.2s;
  flex-shrink: 0;
}
.btn-theme:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.3); }

*{box-sizing:border-box;margin:0;padding:0;}
html {
  background-color: var(--body-bg);
  background-image: 
    radial-gradient(ellipse at 20% 0%, rgba(59,91,252,0.08) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 100%, rgba(107,127,255,0.06) 0%, transparent 60%);
  min-height: 100%;
  transition: background 0.3s;
}
html.dark-html {
  background-image: 
    radial-gradient(ellipse at 20% 0%, rgba(59,91,252,0.15) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 100%, rgba(79,111,255,0.1) 0%, transparent 60%);
}
body{
  background: transparent;
  color:var(--text);font-family:'Space Grotesk',sans-serif;min-height:100vh;
  transition: color 0.3s;
}

/* HEADER */
header{
  background:var(--accent);
  backdrop-filter:blur(12px);
  padding:12px 16px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;
  box-shadow:0 1px 0 rgba(255,255,255,0.1), 0 4px 24px rgba(59,91,252,0.3);
}
.logo{display:flex;align-items:center;gap:10px;}
.logo-mark{
  width:36px;height:36px;
  background:rgba(255,255,255,0.2);
  border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:900;color:#fff;flex-shrink:0;
  border:1.5px solid rgba(255,255,255,0.35);
  letter-spacing:-1px;
}
.logo-text h1{font-size:15px;font-weight:800;color:#fff;letter-spacing:-0.3px;}
.logo-text p{font-size:10px;color:rgba(255,255,255,0.65);font-family:var(--mono);}
.header-right{display:flex;align-items:center;gap:8px;}
.sync-pill{
  display:flex;align-items:center;gap:5px;
  background:rgba(255,255,255,0.15);
  border:1px solid rgba(255,255,255,0.25);
  padding:5px 10px;border-radius:20px;
}
.sync-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.4);transition:background 0.3s;}
.sync-dot.synced{background:#34d399;box-shadow:0 0 8px #34d399;}
.sync-dot.syncing{background:#fbbf24;animation:pulse 1s infinite;}
.sync-dot.error{background:#f87171;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
.sync-label{font-size:10px;color:rgba(255,255,255,0.85);font-family:var(--mono);font-weight:700;}
.btn-export{
  background:rgba(255,255,255,0.18);color:#fff;
  border:1px solid rgba(255,255,255,0.3);
  padding:7px 14px;font-family:var(--sans);font-weight:700;font-size:12px;
  cursor:pointer;border-radius:10px;
  display:flex;align-items:center;gap:5px;
  letter-spacing:0.3px;
}
.btn-theme{
  width:34px;height:34px;
  background:rgba(255,255,255,0.15);
  border:1px solid rgba(255,255,255,0.25);
  border-radius:10px;cursor:pointer;font-size:16px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}

/* STATS */
.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:transparent;padding:12px 12px 0;}
.stat-item{
  background:var(--card);
  padding:12px 6px;text-align:center;
  border-radius:16px;
  border:1.5px solid var(--border);
  box-shadow:var(--shadow-sm);
  position:relative;overflow:hidden;
}
.stat-item::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:var(--accent);border-radius:16px 16px 0 0;
}
.stat-item:nth-child(2)::before{background:var(--green);}
.stat-item:nth-child(3)::before{background:var(--red);}
.stat-item:nth-child(4)::before{background:var(--orange);}
.stat-num{font-size:20px;font-weight:800;font-family:'Space Grotesk',sans-serif;color:var(--accent);line-height:1;letter-spacing:-0.5px;}
.stat-item:nth-child(2) .stat-num{color:var(--green);}
.stat-item:nth-child(3) .stat-num{color:var(--red);}
.stat-item:nth-child(4) .stat-num{color:var(--orange);}
.stat-label{font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:4px;font-weight:700;}

/* PROGRESS + CATEGORY ROW */
.dash-row{display:flex;align-items:center;gap:10px;padding:10px 12px 12px;background:transparent;}
.btn-select-cat{
  flex:1;background:var(--card);color:var(--text);
  border:1.5px solid var(--border);
  padding:13px 16px;font-family:var(--sans);font-weight:700;font-size:13px;
  cursor:pointer;border-radius:14px;text-align:left;
  box-shadow:var(--shadow-sm);
  display:flex;align-items:center;justify-content:space-between;
  letter-spacing:-0.2px;
}
.btn-select-cat span{font-size:18px;color:var(--muted);}

/* PROGRESS CIRCLE */
.progress-wrap{flex-shrink:0;width:72px;height:72px;position:relative;cursor:pointer;}
.progress-circle{width:72px;height:72px;transform:rotate(-90deg);}
.progress-bg{fill:none;stroke:var(--border2);stroke-width:6;}
.progress-fill{fill:none;stroke:var(--teal);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset 0.6s ease;}
.progress-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.progress-pct{font-size:14px;font-weight:800;font-family:var(--mono);color:var(--accent);}
.progress-lbl{font-size:7px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;}

/* TABS - hidden, replaced by dash-row select cat */
.cat-section{background:transparent;padding:0 12px 0;}
.cat-tabs{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;gap:6px;align-items:center;padding:6px 0;}
.cat-tabs::-webkit-scrollbar{display:none;}
.cat-tab{
  flex-shrink:0;padding:7px 14px;font-size:12px;
  font-family:var(--sans);font-weight:600;
  color:var(--muted2);background:var(--card);
  border:1.5px solid var(--border);
  border-radius:20px;cursor:pointer;white-space:nowrap;
  transition:all 0.15s;display:flex;align-items:center;gap:6px;
}
.cat-tab.active{color:#fff;background:var(--accent);border-color:var(--accent);box-shadow:0 2px 12px rgba(59,91,252,0.3);}
.cat-tab .cnt{font-size:10px;padding:1px 6px;border-radius:10px;font-family:var(--mono);background:var(--border);color:var(--muted);}
.cat-tab.active .cnt{background:rgba(255,255,255,0.2);color:#fff;}
.cat-actions{display:flex;gap:4px;flex-shrink:0;padding:0 4px;}
.btn-cat-add{width:30px;height:30px;background:var(--accent);border:none;color:#fff;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;font-weight:900;box-shadow:0 2px 8px rgba(59,91,252,0.3);}
.btn-cat-del{width:30px;height:30px;background:rgba(239,68,68,0.08);border:1.5px solid rgba(239,68,68,0.25);color:var(--red);border-radius:50%;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;}
.btn-cat-del.hidden{display:none;}

/* CONTENT */
.content{padding:16px;padding-bottom:80px;}
.content-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.content-title{font-size:20px;font-weight:700;background:linear-gradient(90deg,var(--text),var(--muted2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.btn-add-item{background:linear-gradient(160deg,var(--green),#16a34a);color:#fff;border:2px solid rgba(255,255,255,0.2);padding:11px 18px;font-family:var(--sans);font-weight:800;font-size:13px;cursor:pointer;border-radius:16px;display:flex;align-items:center;gap:5px;box-shadow:0 5px 0 #1a5e2a,var(--clay-inset);}

/* SEARCH */
.search-wrap{display:flex;gap:8px;margin-bottom:14px;}
.search-input-wrap{flex:1;position:relative;}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none;}
.search-wrap input{width:100%;background:var(--card);border:2px solid var(--border2);color:var(--text);padding:12px 14px 12px 36px;border-radius:14px;font-family:var(--sans);font-size:13px;outline:none;transition:border-color 0.2s;box-shadow:inset 0 3px 0 rgba(0,0,0,0.2);font-weight:500;}
.search-wrap input:focus{border-color:var(--gold);box-shadow:inset 0 3px 0 rgba(0,0,0,0.2),0 0 0 3px rgba(255,217,61,0.15);}
.search-wrap input::placeholder{color:var(--muted);}
.filter-select{background:var(--card);border:2px solid var(--border2);color:var(--text);padding:12px 10px;border-radius:14px;font-family:var(--sans);font-size:12px;outline:none;-webkit-appearance:none;cursor:pointer;box-shadow:inset 0 3px 0 rgba(0,0,0,0.2);font-weight:600;}


/* ITEMS - MODERN TECHY BLUE */
.items-list{display:flex;flex-direction:column;gap:10px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.item-card{
  background:var(--card);
  border:1.5px solid var(--border);
  border-left:4px solid var(--accent);
  border-radius:16px;
  overflow:hidden;
  animation:fadeIn 0.2s ease;
  box-shadow:var(--shadow-sm);
}

.panel-top{
  background:var(--card);
  padding:13px 14px 10px;
  display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
}
.panel-top-info{flex:1;min-width:0;}
.panel-name{
  font-size:14px;font-weight:700;color:var(--text);
  line-height:1.35;margin-bottom:5px;
  font-family:'Space Grotesk',sans-serif;letter-spacing:-0.2px;
}
.panel-barcode{
  font-family:var(--mono);font-size:11px;font-weight:700;
  color:var(--accent);letter-spacing:0.5px;
}
.panel-cat-badge{
  display:inline-block;background:var(--accent3);color:var(--accent);
  font-size:9px;font-weight:700;padding:2px 8px;border-radius:6px;
  margin-top:5px;text-transform:uppercase;letter-spacing:0.8px;border:1px solid var(--border);
}
.item-timestamp{
  font-size:12px;
  font-weight:700;
  color:var(--accent);
  margin-top:6px;
  font-family:'Space Mono',monospace;
  letter-spacing:0.2px;
  display:flex;
  align-items:center;
  gap:4px;
}
.panel-actions{display:flex;gap:6px;flex-shrink:0;}
.ibtn{
  width:30px;height:30px;background:var(--surface);
  border:1.5px solid var(--border);border-radius:8px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;color:var(--muted);font-weight:700;
}
.ibtn-del{color:var(--red);border-color:rgba(239,68,68,0.2);background:rgba(239,68,68,0.05);}
.ibtn:active{background:var(--border);}

.panel-bottom{
  background:var(--surface);border-top:1.5px solid var(--border);
  display:grid;grid-template-columns:1fr 1fr 1fr;
}
.panel-qty-block{
  padding:10px 6px;text-align:center;border-right:1px solid var(--border);
}
.panel-qty-block:last-child{border-right:none;}
.panel-qty-num{
  font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:800;
  color:var(--text);line-height:1;letter-spacing:-0.5px;
}
.panel-qty-num.low{color:var(--red);}
.panel-qty-num.warn{color:var(--orange);}
.panel-qty-num.ok{color:var(--green);}
.panel-qty-num.neutral{color:var(--muted2);}
.panel-label{
  font-size:7px;font-weight:700;text-transform:uppercase;letter-spacing:1px;
  color:var(--muted);margin-top:4px;font-family:var(--mono);
}

.panel-note{
  background:var(--accent3);border-top:1px solid var(--border);
  padding:6px 14px;font-size:11px;color:var(--muted2);font-style:italic;
}

.diff-chip{font-family:'Space Mono',monospace;font-size:18px;font-weight:700;}
.diff-chip.pos{color:var(--green);}
.diff-chip.neg{color:var(--red);}
.diff-chip.zero{color:var(--muted);}

/* EMPTY */
.empty-state{text-align:center;padding:50px 20px;display:none;}
.empty-icon{width:64px;height:64px;background:var(--card);border:1px solid var(--border);border-radius:16px;font-size:28px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;}
.empty-state h3{font-size:16px;color:var(--muted2);margin-bottom:6px;}
.empty-state p{font-size:13px;color:var(--muted);}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);z-index:200;align-items:flex-end;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:var(--card);border:1.5px solid var(--border);border-top:3px solid var(--accent);border-radius:24px 24px 0 0;padding:8px 20px 40px;width:100%;max-width:520px;animation:sheetUp 0.28s ease;max-height:92vh;overflow-y:auto;box-shadow:0 -8px 40px rgba(59,91,252,0.15);}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 18px;}
.modal h2{font-size:17px;font-weight:700;margin-bottom:18px;color:var(--gold);}
.form-group{margin-bottom:14px;}
.form-group label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted2);margin-bottom:6px;font-family:var(--mono);}
.form-group input,.form-group select{width:100%;background:var(--surface);border:1.5px solid var(--border);color:var(--text);padding:12px 14px;border-radius:12px;font-family:var(--sans);font-size:15px;outline:none;transition:all 0.2s;-webkit-appearance:none;font-weight:500;}
.form-group input:focus,.form-group select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,91,252,0.12);}
.form-group input:focus,.form-group select:focus{border-color:var(--gold);}
.form-group input::placeholder{color:var(--muted);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.modal-btns{display:flex;gap:10px;margin-top:22px;}
.btn-save{flex:1;background:var(--accent);color:#fff;border:none;padding:14px;font-family:var(--sans);font-weight:700;font-size:15px;cursor:pointer;border-radius:14px;box-shadow:0 4px 16px rgba(59,91,252,0.35);letter-spacing:0.3px;}
.btn-cancel{background:var(--surface);border:1.5px solid var(--border);color:var(--muted2);padding:14px 20px;font-family:var(--sans);font-size:15px;font-weight:600;cursor:pointer;border-radius:14px;}

/* CHAT */
.chat-fab {
  position: fixed;
  bottom: 24px;
  right: 20px;
  width: 52px; height: 52px;
  background: var(--accent);
  border: none;
  border-radius: 50%;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  box-shadow: 0 4px 20px rgba(59,91,252,0.45);
  z-index: 150;
  transition: transform 0.2s;
}
.chat-fab:active { transform: scale(0.92); }
.chat-badge {
  position: absolute; top: -2px; right: -2px;
  background: var(--red); color: #fff;
  font-size: 10px; font-weight: 800;
  min-width: 18px; height: 18px;
  border-radius: 10px; padding: 0 4px;
  display: none; align-items: center; justify-content: center;
  font-family: var(--mono);
  border: 2px solid var(--bg);
}
.chat-badge.show { display: flex; }

.chat-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 200;
  align-items: flex-end;
  justify-content: center;
  backdrop-filter: blur(4px);
}
.chat-overlay.open { display: flex; }

.chat-panel {
  background: var(--card);
  border: 1.5px solid var(--border);
  border-top: 3px solid var(--accent);
  border-radius: 24px 24px 0 0;
  width: 100%; max-width: 520px;
  height: 75vh;
  display: flex; flex-direction: column;
  animation: sheetUp 0.28s ease;
  overflow: hidden;
}

.chat-header {
  padding: 14px 16px 12px;
  border-bottom: 1.5px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}
.chat-header-info { display: flex; align-items: center; gap: 10px; }
.chat-header-avatar {
  width: 36px; height: 36px;
  background: var(--accent);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
}
.chat-header-title { font-size: 15px; font-weight: 700; color: var(--text); }
.chat-header-sub { font-size: 11px; color: var(--muted); font-family: var(--mono); }
.chat-close {
  width: 30px; height: 30px;
  background: var(--surface); border: 1.5px solid var(--border);
  border-radius: 50%; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; color: var(--muted);
}

.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 14px 14px 8px;
  display: flex; flex-direction: column; gap: 10px;
  -webkit-overflow-scrolling: touch;
}

.chat-msg {
  display: flex; flex-direction: column; max-width: 80%;
}
.chat-msg.mine { align-self: flex-end; align-items: flex-end; }
.chat-msg.theirs { align-self: flex-start; align-items: flex-start; }

.chat-bubble-wrap {
  display: flex; align-items: center; gap: 6px;
}
.chat-del-btn {
  background: rgba(239,68,68,0.1);
  border: 1px solid rgba(239,68,68,0.2);
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  padding: 4px 6px;
  flex-shrink: 0;
  opacity: 0;
  width: 0;
  overflow: hidden;
  transition: all 0.2s;
  color: var(--red);
}
.chat-del-btn.visible {
  opacity: 1;
  width: auto;
}
.chat-bubble {
  padding: 9px 13px;
  border-radius: 16px;
  font-size: 14px; line-height: 1.4;
  font-family: var(--sans); font-weight: 500;
  word-break: break-word;
}
.chat-msg.mine .chat-bubble {
  background: var(--accent);
  color: #fff;
  border-bottom-right-radius: 4px;
}
.chat-msg.theirs .chat-bubble {
  background: var(--surface);
  color: var(--text);
  border: 1.5px solid var(--border);
  border-bottom-left-radius: 4px;
}

.chat-meta {
  font-size: 10px; color: var(--muted);
  font-family: var(--mono);
  margin-top: 3px; padding: 0 4px;
}

.chat-input-row {
  padding: 10px 12px 16px;
  border-top: 1.5px solid var(--border);
  display: flex; gap: 8px; align-items: flex-end;
  flex-shrink: 0;
  background: var(--card);
}
.chat-name-row {
  padding: 8px 12px 0;
  display: flex; gap: 8px;
}
.chat-name-input {
  flex: 1; background: var(--surface);
  border: 1.5px solid var(--border);
  color: var(--text); padding: 8px 12px;
  border-radius: 10px; font-family: var(--sans);
  font-size: 13px; outline: none;
}
.chat-name-input:focus { border-color: var(--accent); }

.chat-text-input {
  flex: 1; background: var(--surface);
  border: 1.5px solid var(--border);
  color: var(--text); padding: 10px 12px;
  border-radius: 14px; font-family: var(--sans);
  font-size: 14px; outline: none;
  resize: none; min-height: 40px; max-height: 100px;
  line-height: 1.4;
}
.chat-text-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,91,252,0.1); }

.chat-send-btn {
  width: 40px; height: 40px;
  background: var(--accent);
  border: none; border-radius: 50%;
  cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  box-shadow: 0 2px 10px rgba(59,91,252,0.35);
}
.chat-send-btn:active { transform: scale(0.92); }

.chat-empty {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  color: var(--muted); gap: 8px;
}
.chat-empty .icon { font-size: 40px; }
.chat-empty p { font-size: 13px; }

/* Dark mode chat */
body.dark .chat-panel { background: #111827; border-color: #1e2d52; }
body.dark .chat-header { border-color: #1e2d52; }
body.dark .chat-msg.theirs .chat-bubble { background: #0d1228; border-color: #1e2d52; }
body.dark .chat-input-row { background: #111827; border-color: #1e2d52; }
body.dark .chat-text-input { background: #0d1228; border-color: #1e2d52; color: #e8eeff; }
body.dark .chat-name-input { background: #0d1228; border-color: #1e2d52; color: #e8eeff; }

/* LOADING */
.loading-overlay{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:16px;}
.spinner-ring{width:44px;height:44px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-family:var(--mono);font-size:12px;color:var(--muted);}

/* WATERMARK */
.watermark{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:10px;color:var(--muted);pointer-events:none;z-index:10;white-space:nowrap;background:var(--card);padding:5px 14px;border-radius:20px;border:1.5px solid var(--border);box-shadow:var(--shadow-sm);font-weight:600;letter-spacing:0.3px;}
.watermark span{color:var(--gold);}

/* TOAST */
.toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--card2);border:2px solid var(--border2);color:var(--text);padding:12px 20px;border-radius:20px;font-size:13px;font-weight:700;opacity:0;transition:all 0.3s;z-index:999;white-space:nowrap;box-shadow:0 5px 0 rgba(0,0,0,0.3),var(--clay-inset);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.success{border-color:var(--green);color:var(--green);}
.toast.error{border-color:var(--red);color:var(--red);}

::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner-ring"></div>
  <div class="loading-text">Connecting to database...</div>
</div>

<header>
  <div class="logo">
    <div class="logo-mark">S</div>
    <div class="logo-text">
      <h1>StockTake Pro</h1>
      <p id="sessionDate">—</p>
    </div>
  </div>
  <div class="header-right">
    <button class="btn-theme" id="themeToggle" onclick="toggleTheme()" title="Toggle Dark/Light Mode">🌙</button>
    <div class="sync-pill">
      <div class="sync-dot" id="syncDot"></div>
      <span class="sync-label" id="syncLabel">—</span>
    </div>
    <button class="btn-export" onclick="exportData()">↓ CSV</button>
  </div>
</header>

<div class="stats-bar">
  <div class="stat-item"><div class="stat-num" id="statTotal">0</div><div class="stat-label">Items</div></div>
  <div class="stat-item"><div class="stat-num" id="statCats">0</div><div class="stat-label">Categories</div></div>
  <div class="stat-item"><div class="stat-num" id="statDiff">0</div><div class="stat-label">Mismatch</div></div>
  <div class="stat-item"><div class="stat-num" id="statMatch">0</div><div class="stat-label">Matched</div></div>
</div>

<div class="dash-row">
  <button class="btn-select-cat" id="btnSelectCat" onclick="toggleCatPanel()">
    <span id="activeCatLabel">All Categories</span>
    <span>▾</span>
  </button>
  <div class="progress-wrap" title="Stock take progress">
    <svg class="progress-circle" viewBox="0 0 72 72">
      <circle class="progress-bg" cx="36" cy="36" r="30"/>
      <circle class="progress-fill" id="progressFill" cx="36" cy="36" r="30"
        stroke-dasharray="188.5" stroke-dashoffset="188.5"/>
    </svg>
    <div class="progress-text">
      <div class="progress-pct" id="progressPct">0%</div>
      <div class="progress-lbl">Done</div>
    </div>
  </div>
</div>

<div class="cat-section" id="catPanel" style="display:none">
  <div style="display:flex;align-items:center;">
    <div class="cat-tabs" id="catTabs"></div>
    <div class="cat-actions">
      <button class="btn-cat-add" onclick="openCatModal()">+</button>
      <button class="btn-cat-del hidden" id="btnDelCat">🗑</button>
    </div>
  </div>
</div>

<div class="content">
  <div class="content-header">
    <div class="content-title" id="activeCatName">All Items</div>
    <button class="btn-add-item" onclick="openItemModal()">+ Add Item</button>
  </div>
  <div class="search-wrap">
    <div class="search-input-wrap">
      <span class="search-icon">⌕</span>
      <input type="text" id="searchInput" placeholder="Search barcode or name..." inputmode="numeric" pattern="[0-9]*" oninput="renderItems()">
    </div>
    <select class="filter-select" id="filterStatus" onchange="renderItems()">
      <option value="all">All</option>
      <option value="match">Matched</option>
      <option value="diff">Mismatch</option>
    </select>
  </div>
  <div class="items-list" id="itemsList"></div>
  <div class="empty-state" id="emptyState">
    <div class="empty-icon">📦</div>
    <h3>No items yet</h3>
    <p>Tap <strong>+ Add Item</strong> to start.</p>
  </div>
</div>

<div class="watermark">Created by <span>Ali Tmomo</span></div>

<!-- ITEM MODAL -->
<div class="modal-overlay" id="itemModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <h2 id="modalItemTitle">+ Add New Item</h2>
    <div class="form-group"><label>Barcode</label><input type="text" id="fieldBarcode" placeholder="e.g. 8888001234567" inputmode="numeric"></div>
    <div class="form-group"><label>Item Name</label><input type="text" id="fieldName" placeholder="e.g. Milo 3in1 30g"></div>
    <div class="form-group"><label>Category</label><select id="fieldCategory"></select></div>
    <div class="form-row">
      <div class="form-group"><label>Physical Qty</label><input type="number" id="fieldPhysical" placeholder="0" min="0" inputmode="numeric"></div>
      <div class="form-group"><label>System Qty</label><input type="number" id="fieldSystem" placeholder="0" min="0" inputmode="numeric"></div>
    </div>
    <div class="form-group"><label>Note (Optional)</label><input type="text" id="fieldNote" placeholder="e.g. damaged, missing..."></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeItemModal()">Cancel</button>
      <button class="btn-save" onclick="saveItem()">Save Item</button>
    </div>
  </div>
</div>

<!-- CATEGORY MODAL -->
<div class="modal-overlay" id="catModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <h2>+ New Category</h2>
    <div class="form-group"><label>Category Name</label><input type="text" id="fieldCatName" placeholder="e.g. Beverages, Snacks..."></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeCatModal()">Cancel</button>
      <button class="btn-save" onclick="saveCategory()">Add Category</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getDatabase, ref, onValue, set, push, remove, update } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

const app = initializeApp({ databaseURL:'https://stock-tacking-default-rtdb.asia-southeast1.firebasedatabase.app' });
const db = getDatabase(app);

let state = { categories:[], items:[] };
let activeCategory = 'all';
let editingId = null;

document.getElementById('sessionDate').textContent =
  new Date().toLocaleDateString('en-MY',{weekday:'short',day:'numeric',month:'short',year:'numeric'});

function setSyncStatus(s) {
  const dot = document.getElementById('syncDot');
  const lbl = document.getElementById('syncLabel');
  dot.className = 'sync-dot ' + s;
  lbl.textContent = s==='synced'?'Live':s==='syncing'?'Saving':'Error';
}

let _isFirstLoad = true;

onValue(ref(db,'stocktaking'), snap => {
  const data = snap.val() || {};
  const newCategories = data.categories ? Object.values(data.categories) : [];
  const newItems = data.items ? Object.entries(data.items).map(([id,v])=>({id,...v})) : [];

  if (!data.categories) {
    set(ref(db,'stocktaking/categories'),{0:'Beverages',1:'Food',2:'Equipment',3:'Others'});
  }

  const scrollY = window.scrollY || window.pageYOffset;
  const catsChanged = JSON.stringify(newCategories) !== JSON.stringify(state.categories);
  const itemCountChanged = newItems.length !== state.items.length;

  state.categories = newCategories;
  state.items = newItems;
  window._stateItems = state.items;

  document.getElementById('loadingOverlay').style.display = 'none';
  setSyncStatus('synced');

  if (_isFirstLoad) {
    _isFirstLoad = false;
    renderAll();
    return;
  }

  // Only full re-render if categories changed or item count changed
  if (catsChanged || itemCountChanged) {
    renderAll();
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        window.scrollTo({ top: scrollY, behavior: 'instant' });
      });
    });
    return;
  }

  // Otherwise just update stats and individual cards in-place
  updateStats();
  renderCatTabs();

  // Update individual item cards that changed
  newItems.forEach(item => {
    const card = document.querySelector(`[data-item-id="${item.id}"]`);
    if (card) {
      const diff = (item.physical||0)-(item.system||0);
      const dc = diff>0?'pos':diff<0?'neg':'zero';
      const dt = diff>0?'+'+diff:''+diff;
      const pc = item.physical===0?'low':item.physical===item.system?'ok':'warn';

      // Update physical qty block
      const physBlock = card.querySelector('.qty-val-physical');
      if (physBlock) {
        physBlock.textContent = item.physical||0;
        physBlock.className = 'panel-qty-num qty-val-physical ' + pc;
      }

      // Update diff block
      const diffBlock = card.querySelector('.qty-val-diff');
      if (diffBlock) {
        diffBlock.innerHTML = `<span class="diff-chip ${dc}">${dt}</span>`;
      }

      // Update timestamp
      const tsEl = card.querySelector('.item-timestamp');
      if (tsEl && (item.updatedAt||item.addedAt)) {
        tsEl.textContent = '🕐 ' + formatDate(item.updatedAt||item.addedAt);
      }
    } else {
      // Card not found in DOM (might be lazy-loaded away) - just update state, no duplicate
    }
  });

}, () => {
  setSyncStatus('error');
  showToast('Connection failed!','error');
  document.getElementById('loadingOverlay').style.display = 'none';
});

function renderAll() { renderCatTabs(); renderItems(); updateStats(); }

window.renderCatTabs = function() {
  const tabs = document.getElementById('catTabs');
  const btnDel = document.getElementById('btnDelCat');
  let html = `<button class="cat-tab ${activeCategory==='all'?'active':''}" onclick="setCategory('all')">All <span class="cnt">${state.items.length}</span></button>`;
  state.categories.forEach(cat => {
    const cnt = state.items.filter(i=>i.category===cat).length;
    const safeCat = cat.replace(/'/g,"\\'");
    html += `<button class="cat-tab ${activeCategory===cat?'active':''}" onclick="setCategory('${safeCat}')">${cat} <span class="cnt">${cnt}</span></button>`;
  });
  tabs.innerHTML = html;
  btnDel.className = activeCategory!=='all' ? 'btn-cat-del' : 'btn-cat-del hidden';
  btnDel.onclick = () => deleteCategory(activeCategory);
  const sel = document.getElementById('fieldCategory');
  if (sel) sel.innerHTML = state.categories.map(c=>`<option value="${c}">${c}</option>`).join('');
}

let _filteredItems = [];
let _pageSize = 50;
let _currentPage = 0;

function itemCardHTML(item) {
  const diff = (item.physical||0)-(item.system||0);
  const dc = diff>0?'pos':diff<0?'neg':'zero';
  const dt = diff>0?'+'+diff:''+diff;
  const pc = item.physical===0?'low':item.physical===item.system?'ok':'warn';
  return `<div class="item-card" data-item-id="${item.id}">
    <div class="panel-top">
      <div class="panel-top-info">
        <div class="panel-name">${item.name||'—'}</div>
        <div class="panel-barcode">${item.barcode||'No barcode'}</div>
        <div class="panel-cat-badge">${item.category}</div>
        ${item.note?`<div style="font-size:10px;color:rgba(255,255,255,0.6);margin-top:4px;font-style:italic">✎ ${item.note}</div>`:''}
        ${(item.updatedAt||item.addedAt)?`<div class="item-timestamp">🕐 ${formatDate(item.updatedAt||item.addedAt)}</div>`:''}
      </div>
      <div class="panel-actions">
        <button class="ibtn" onclick="editItem('${item.id}')">✎</button>
        <button class="ibtn ibtn-del" onclick="deleteItem('${item.id}')">✕</button>
      </div>
    </div>
    <div class="panel-bottom">
      <div class="panel-qty-block">
        <div class="panel-qty-num qty-val-physical ${pc}">${item.physical||0}</div>
        <div class="panel-label">PHYSICAL</div>
      </div>
      <div class="panel-qty-block">
        <div class="panel-qty-num neutral">${item.system||0}</div>
        <div class="panel-label">SYSTEM</div>
      </div>
      <div class="panel-qty-block">
        <div class="panel-qty-num qty-val-diff"><span class="diff-chip ${dc}">${dt}</span></div>
        <div class="panel-label">DIFF</div>
      </div>
    </div>
  </div>`;
}

window.renderItems = function() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const filter = document.getElementById('filterStatus').value;
  _filteredItems = state.items.filter(item => {
    const matchCat = activeCategory==='all' || item.category===activeCategory;
    const matchSearch = !search || (item.barcode||'').toLowerCase().includes(search) || (item.name||'').toLowerCase().includes(search);
    const diff = (item.physical||0)-(item.system||0);
    const matchFilter = filter==='all' || (filter==='match'&&diff===0) || (filter==='diff'&&diff!==0);
    return matchCat && matchSearch && matchFilter;
  });

  _currentPage = 0;
  const list = document.getElementById('itemsList');
  const empty = document.getElementById('emptyState');

  if (!_filteredItems.length) {
    list.innerHTML='';
    empty.style.display='block';
    return;
  }

  empty.style.display = 'none';
  const firstBatch = _filteredItems.slice(0, _pageSize);
  list.innerHTML = firstBatch.map(itemCardHTML).join('');

  // Add load more button if needed
  updateLoadMoreBtn();
}

function updateLoadMoreBtn() {
  const existing = document.getElementById('loadMoreBtn');
  if (existing) existing.remove();

  const loaded = (_currentPage + 1) * _pageSize;
  if (loaded >= _filteredItems.length) return;

  const remaining = _filteredItems.length - loaded;
  const btn = document.createElement('button');
  btn.id = 'loadMoreBtn';
  btn.textContent = `Load ${Math.min(remaining, _pageSize)} more (${remaining} remaining)`;
  btn.style.cssText = `width:100%;padding:14px;margin-top:10px;background:var(--card);border:2px solid var(--border2);color:var(--muted2);border-radius:14px;font-family:var(--sans);font-size:14px;font-weight:700;cursor:pointer;box-shadow:var(--clay-shadow-sm);`;
  btn.onclick = loadMore;
  document.getElementById('itemsList').after(btn);
}

function loadMore() {
  _currentPage++;
  const start = _currentPage * _pageSize;
  const end = start + _pageSize;
  const newItems = _filteredItems.slice(start, end);
  const list = document.getElementById('itemsList');
  newItems.forEach(item => {
    list.insertAdjacentHTML('beforeend', itemCardHTML(item));
  });
  updateLoadMoreBtn();
}

window.updateStats = function() {
  const total = state.items.length;
  const mm = state.items.filter(i=>(i.physical||0)!==(i.system||0)).length;
  const counted = state.items.filter(i=>(i.physical||0)>0).length;
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statCats').textContent = state.categories.length;
  document.getElementById('statDiff').textContent = mm;
  document.getElementById('statMatch').textContent = total-mm;

  // Update progress circle
  const pct = total > 0 ? Math.round((counted/total)*100) : 0;
  const circumference = 188.5;
  const offset = circumference - (pct/100)*circumference;
  document.getElementById('progressFill').style.strokeDashoffset = offset;
  document.getElementById('progressPct').textContent = pct+'%';
}

window.setCategory = function(cat) {
  activeCategory = cat;
  document.getElementById('activeCatName').textContent = cat==='all'?'All Items':cat;
  document.getElementById('activeCatLabel').textContent = cat==='all'?'All Categories':cat;
  // Hide cat panel after selection
  const panel = document.getElementById('catPanel');
  if (panel) panel.style.display = 'none';
  renderCatTabs(); renderItems();
}

window.toggleCatPanel = function() {
  const panel = document.getElementById('catPanel');
  if (panel) panel.style.display = panel.style.display==='none'?'block':'none';
}

window.openCatModal = function() {
  document.getElementById('fieldCatName').value = '';
  document.getElementById('catModal').classList.add('open');
}
window.closeCatModal = function() { document.getElementById('catModal').classList.remove('open'); }

window.saveCategory = async function() {
  const name = document.getElementById('fieldCatName').value.trim();
  if (!name) return;
  if (state.categories.includes(name)) { showToast('Already exists!','error'); return; }
  setSyncStatus('syncing');
  try {
    const obj = {};
    [...state.categories,name].forEach((c,i)=>obj[i]=c);
    await set(ref(db,'stocktaking/categories'),obj);
    showToast('"'+name+'" added!','success');
  } catch(e) { setSyncStatus('error'); showToast('Failed!','error'); }
  closeCatModal();
}

window.deleteCategory = async function(cat) {
  const cnt = state.items.filter(i=>i.category===cat).length;
  if (!confirm(cnt>0?`Delete "${cat}"? ${cnt} item(s) will also be deleted.`:`Delete "${cat}"?`)) return;
  setSyncStatus('syncing');
  try {
    for (const item of state.items.filter(i=>i.category===cat)) await remove(ref(db,`stocktaking/items/${item.id}`));
    const newCats = state.categories.filter(c=>c!==cat);
    const obj = {}; newCats.forEach((c,i)=>obj[i]=c);
    await set(ref(db,'stocktaking/categories'),newCats.length?obj:null);
    activeCategory = 'all';
    document.getElementById('activeCatName').textContent = 'All Items';
    showToast('"'+cat+'" deleted!','success');
  } catch(e) { setSyncStatus('error'); showToast('Failed!','error'); }
}

function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const day = days[d.getDay()];
  const date = d.getDate();
  const month = months[d.getMonth()];
  const year = d.getFullYear();
  let hours = d.getHours();
  const mins = String(d.getMinutes()).padStart(2,'0');
  const ampm = hours >= 12 ? 'PM' : 'AM';
  hours = hours % 12 || 12;
  return `${day}, ${date} ${month} ${year} · ${hours}:${mins} ${ampm}`;
}

function lockBodyScroll() {
  window._lockedScrollY = window.scrollY || window.pageYOffset;
  document.body.style.position = 'fixed';
  document.body.style.top = '-' + window._lockedScrollY + 'px';
  document.body.style.width = '100%';
}

window.openItemModal = function() {
  editingId = null;
  document.getElementById('modalItemTitle').textContent = '+ Add New Item';
  ['fieldBarcode','fieldName','fieldPhysical','fieldSystem','fieldNote'].forEach(id=>document.getElementById(id).value='');
  if (activeCategory!=='all') document.getElementById('fieldCategory').value = activeCategory;
  lockBodyScroll();
  document.getElementById('itemModal').classList.add('open');
}
window.closeItemModal = function() {
  document.getElementById('itemModal').classList.remove('open');
  editingId = null;
  if (window._lockedScrollY !== undefined) {
    const y = window._lockedScrollY;
    window._lockedScrollY = undefined;
    document.body.style.position = '';
    document.body.style.top = '';
    document.body.style.width = '';
    window.scrollTo(0, y);
  }
}

window.editItem = function(id) {
  const item = state.items.find(i=>i.id===id);
  if (!item) return;
  editingId = id;
  document.getElementById('modalItemTitle').textContent = '✎ Edit Item';
  document.getElementById('fieldBarcode').value = item.barcode||'';
  document.getElementById('fieldName').value = item.name||'';
  document.getElementById('fieldCategory').value = item.category;
  document.getElementById('fieldPhysical').value = item.physical||0;
  document.getElementById('fieldSystem').value = item.system||0;
  document.getElementById('fieldNote').value = item.note||'';
  lockBodyScroll();
  document.getElementById('itemModal').classList.add('open');
}

window.saveItem = async function() {
  const barcode = document.getElementById('fieldBarcode').value.trim();
  const name = document.getElementById('fieldName').value.trim();
  const category = document.getElementById('fieldCategory').value;
  const physical = parseInt(document.getElementById('fieldPhysical').value)||0;
  const system = parseInt(document.getElementById('fieldSystem').value)||0;
  const note = document.getElementById('fieldNote').value.trim();
  if (!name) { showToast('Name required!','error'); return; }

  closeItemModal();
  setSyncStatus('syncing');
  try {
    const now = new Date().toISOString();
    if (editingId) {
      await update(ref(db,`stocktaking/items/${editingId}`),{barcode,name,category,physical,system,note,updatedAt:now});
      showToast('Updated!','success');
    } else {
      await push(ref(db,'stocktaking/items'),{barcode,name,category,physical,system,note,addedAt:now,updatedAt:now});
      showToast('Added!','success');
    }

  } catch(e) { setSyncStatus('error'); showToast('Failed!','error'); }
}

window.deleteItem = async function(id) {
  if (!confirm('Delete this item?')) return;
  setSyncStatus('syncing');
  try { await remove(ref(db,`stocktaking/items/${id}`)); showToast('Deleted.','success'); }
  catch(e) { setSyncStatus('error'); showToast('Failed!','error'); }
}

window._savePhysical = async function(id, physical, cb) {
  setSyncStatus('syncing');
  try {
    await update(ref(db,`stocktaking/items/${id}`),{physical});
    setSyncStatus('synced');
    if (cb) cb();
  } catch(e) { setSyncStatus('error'); showToast('Failed!','error'); }
}

window.exportData = function() {
  const today = new Date().toLocaleDateString('en-MY',{day:'2-digit',month:'2-digit',year:'numeric'});
  const headers = ['\u5546\u54c1\u540d\u79f0','\u6761\u7801','\u5546\u54c1\u5206\u7c7b','\u5e93\u5b58','Shop physical Stock'];
  const rows = state.items.map(item=>[item.name||'',item.barcode||'',item.category||'',item.system||0,item.physical||0]);
  const csv = '\uFEFF' + [headers,...rows].map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const blob = new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const filename = 'TMOMO_Taman_Connaught_StockTake_'+today.replace(/\//g,'-')+'.csv';
  const file = new File([blob],filename,{type:'text/csv'});
  if (navigator.share && navigator.canShare && navigator.canShare({files:[file]})) {
    navigator.share({files:[file],title:'StockTake Export'}).catch(()=>dlBlob(blob,filename));
  } else { dlBlob(blob,filename); }
}

function dlBlob(blob,filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Exported!','success');
}

window.showToast = function(msg,type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast '+(type||'');
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2800);
}

['itemModal','catModal'].forEach(id=>{
  document.getElementById(id).addEventListener('click',e=>{
    if (e.target.id===id){ closeItemModal(); closeCatModal(); }
  });
});

  <span class="chat-badge" id="chatBadge"></span>

<!-- CHAT OVERLAY -->
<div class="chat-overlay" id="chatOverlay" id="chatOverlay">
  <div class="chat-panel">
    <div class="chat-header">
      <div class="chat-header-info">
        <div class="chat-header-avatar">👥</div>
        <div>
          <div class="chat-header-title">Team Chat</div>
          <div class="chat-header-sub" id="chatOnlineCount">TMOMO Stock Taking</div>
        </div>
      </div>
      <button class="chat-close" id="chatCloseBtn">✕</button>
    </div>
    <div class="chat-name-row">
      <input class="chat-name-input" id="chatNameInput" placeholder="Your name (e.g. Ali, Ahmad...)" maxlength="20">
    </div>
    <div class="chat-messages" id="chatMessages">
      <div class="chat-empty" id="chatEmpty">
        <div class="icon">💬</div>

      </div>

      <button class="chat-send-btn" id="chatSendBtn">➤</button>
    </div>
  </div>
</div>

<script>
(function() {
  var saved = 'light';
  try { saved = localStorage.getItem('theme') || 'light'; } catch(e) {}
  if (saved === 'dark') {
    document.body.classList.add('dark');
    document.documentElement.classList.add('dark-html');
    document.documentElement.style.backgroundColor = '#0a1628';
    var b = document.getElementById('themeToggle');
    if (b) b.textContent = '\u2600\uFE0F';
  }
})();

function toggleTheme() {
  var isDark = document.body.classList.toggle('dark');
  document.documentElement.classList.toggle('dark-html', isDark);
  document.documentElement.style.backgroundColor = isDark ? '#0a1628' : '#f0fffe';
  var btn = document.getElementById('themeToggle');
  if (btn) btn.textContent = isDark ? '\u2600\uFE0F' : '\uD83C\uDF19';
  try { localStorage.setItem('theme', isDark ? 'dark' : 'light'); } catch(e) {}
}
</script>
<script>
// TEAM CHAT - Pure REST API, no module dependency
var DB = 'https://stock-tacking-default-rtdb.asia-southeast1.firebasedatabase.app/stocktaking/chat';
var chatOpen = false;
var lastCount = 0;
var myChatName = '';
var chatPollInterval = null;

try { myChatName = localStorage.getItem('chatName') || ''; } catch(e) {}

function openChat() {
  chatOpen = true;
  document.getElementById('chatOverlay').classList.add('open');
  document.getElementById('chatBadge').classList.remove('show');
  document.getElementById('chatBadge').textContent = '';
  if (myChatName) document.getElementById('chatNameInput').value = myChatName;
  loadChat();
  if (!chatPollInterval) chatPollInterval = setInterval(loadChat, 3000);
}

function closeChat() {
  chatOpen = false;
  document.getElementById('chatOverlay').classList.remove('open');
}

// loadChat moved above

var chatMsgKeys = {};

function loadChat() {
  fetch(DB + '.json')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      chatMsgKeys = {};
      var msgs = [];
      if (data) {
        Object.entries(data).forEach(function(entry) {
          var key = entry[0]; var m = entry[1];
          if (m && m.text) {
            m._key = key;
            chatMsgKeys[key] = m;
            msgs.push(m);
          }
        });
        msgs.sort(function(a,b) { return (a.ts||0)-(b.ts||0); });
      }
      renderChat(msgs);
      if (!chatOpen && msgs.length > lastCount && lastCount > 0) {
        var badge = document.getElementById('chatBadge');
        badge.textContent = msgs.length - lastCount;
        badge.classList.add('show');
      }
      if (!chatOpen) lastCount = msgs.length;
    })
    .catch(function() {});
}



function renderChat(msgs) {
  var container = document.getElementById('chatMessages');
  var empty = document.getElementById('chatEmpty');
  var myName = document.getElementById('chatNameInput').value.trim() || myChatName;
  if (!msgs.length) { empty.style.display='flex'; return; }
  empty.style.display = 'none';
  var near = container.scrollHeight - container.scrollTop - container.clientHeight < 120;
  container.innerHTML = '';
  msgs.forEach(function(msg) {
    var mine = msg.sender === myName;
    var time = msg.time ? new Date(msg.time).toLocaleTimeString('en-MY',{hour:'2-digit',minute:'2-digit'}) : '';
    var div = document.createElement('div');
    div.className = 'chat-msg ' + (mine ? 'mine' : 'theirs');
    div.innerHTML = '<div class="chat-bubble-wrap">' +
      '<div class="chat-bubble">' + esc(msg.text) + '</div>' +
      (mine ? '<button class="chat-del-btn" data-key="' + msg._key + '" data-sender="' + esc(msg.sender) + '" title="Delete">🗑</button>' : '') +
      '</div>' +
      '<div class="chat-meta">' + (mine ? '' : esc(msg.sender) + ' · ') + time + '</div>';

    // Double tap to show delete button (mine only)
    if (mine) {
      var delBtn = div.querySelector('.chat-del-btn');
      var lastTap = 0;

      div.addEventListener('touchend', function(e) {
        var now = Date.now();
        if (now - lastTap < 300) {
          // Double tap - toggle delete button
          e.preventDefault();
          document.querySelectorAll('.chat-del-btn.visible').forEach(function(b) {
            b.classList.remove('visible');
          });
          delBtn.classList.toggle('visible');
        }
        lastTap = now;
      });

      // Hide delete when tapping elsewhere
      document.addEventListener('touchstart', function(e) {
        if (!div.contains(e.target)) delBtn.classList.remove('visible');
      }, {passive: true});

      // Delete on click
      delBtn.addEventListener('click', function() {
        var key = this.dataset.key;
        div.style.opacity = '0.4';
        div.style.transition = 'opacity 0.2s';
        setTimeout(function() { div.remove(); }, 200);
        fetch(DB + '/' + key + '.json', { method: 'DELETE' }).catch(function() {});
      });
    }

    container.appendChild(div);
  });

  if (near || chatOpen) container.scrollTop = container.scrollHeight;
}

function sendChat() {
  var input = document.getElementById('chatInput');
  var nameInput = document.getElementById('chatNameInput');
  var msg = input.value.trim();
  var name = nameInput.value.trim() || 'Anonymous';
  if (!msg) return;
  myChatName = name;
  try { localStorage.setItem('chatName', name); } catch(e) {}
  input.value = '';

  // Instantly show message in UI
  var now = new Date();
  var time = now.toLocaleTimeString('en-MY', {hour:'2-digit', minute:'2-digit'});
  var tempMsg = { text: msg, sender: name, time: now.toISOString(), ts: now.getTime(), _key: '_temp_' + now.getTime() };
  appendChatMsg(tempMsg, true);

  // Send to Firebase
  fetch(DB + '.json', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ text: msg, sender: name, time: now.toISOString(), ts: now.getTime() })
  }).then(function() {
    loadChat(); // refresh to get real key
  }).catch(function() {});
}

function appendChatMsg(msg, mine) {
  var container = document.getElementById('chatMessages');
  var empty = document.getElementById('chatEmpty');
  empty.style.display = 'none';

  var time = msg.time ? new Date(msg.time).toLocaleTimeString('en-MY',{hour:'2-digit',minute:'2-digit'}) : '';
  var div = document.createElement('div');
  div.className = 'chat-msg ' + (mine ? 'mine' : 'theirs');
  div.dataset.tempKey = msg._key || '';
  div.innerHTML = '<div class="chat-bubble-wrap">' +
    '<div class="chat-bubble">' + esc(msg.text) + '</div>' +
    (mine ? '<button class="chat-del-btn" data-key="' + (msg._key||'') + '" data-sender="' + esc(msg.sender) + '">🗑</button>' : '') +
    '</div>' +
    '<div class="chat-meta">' + (mine ? '' : esc(msg.sender) + ' · ') + time + '</div>';

  if (mine) {
    var delBtn = div.querySelector('.chat-del-btn');
    var lastTap = 0;
    div.addEventListener('touchend', function(e) {
      var now = Date.now();
      if (now - lastTap < 300) {
        e.preventDefault();
        document.querySelectorAll('.chat-del-btn.visible').forEach(function(b) { b.classList.remove('visible'); });
        delBtn.classList.toggle('visible');
      }
      lastTap = now;
    });
    document.addEventListener('touchstart', function(e) {
      if (!div.contains(e.target)) delBtn.classList.remove('visible');
    }, {passive: true});
    delBtn.addEventListener('click', function() {
      var key = this.dataset.key;
      div.style.opacity = '0.4';
      setTimeout(function() { div.remove(); }, 200);
      if (key && !key.startsWith('_temp_')) {
        fetch(DB + '/' + key + '.json', { method: 'DELETE' }).catch(function() {});
      }
    });
  }

  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// Wire up buttons
document.getElementById('chatFab').addEventListener('click', openChat);
document.getElementById('chatCloseBtn').addEventListener('click', closeChat);
document.getElementById('chatOverlay').addEventListener('click', function(e) { if(e.target===this) closeChat(); });
document.getElementById('chatSendBtn').addEventListener('click', sendChat);
document.getElementById('chatInput').addEventListener('keydown', function(e) {
  if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
});

// Poll for new messages in background
setInterval(loadChat, 5000);
</script>
